    <script>
        function toggleDropdown() {
            var dropdown = document.querySelector(".dropdown");
            dropdown.classList.toggle("open");
        }

        function changeLanguage(lang) {
            const translations = {
                ar: {
                    donate: "تبرع الآن",
                    home: "الصفحة الرئيسية",
                    services: "الخدمات",
                    donateSection: "مشروع انقطاع المياه",
                    chooseWaterAmount: "اختر كمية الماء",
                    donateBtn: "تبرع"
                },
                en: {
                    donate: "Donate Now",
                    home: "Home",
                    services: "Services",
                    donateSection: "Water Cut Project",
                    chooseWaterAmount: "Choose Amount of Water",
                    donateBtn: "Donate"
                }
            };

            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                el.textContent = translations[lang][key] || el.textContent;
            });
        }
    </script>
</head>
