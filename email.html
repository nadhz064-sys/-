<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: row-reverse;
        }

        .login-section {
            width: 50%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .login-section h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .login-section p {
            color: #555;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            text-align: right;
            width: 100%;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #cccccc;
            border-radius: 5px;
            text-align: left;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 300px; /* تعديل عرض الأزرار */
            height: 40px; /* تعديل الارتفاع */
            padding: 5px; /* تقليل البادينغ */
            font-size: 14px; /* تصغير الخط */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            color: black;
            border: 1px solid #ccc;
        }

        .apple-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            color: white;
        }

        .google-btn img,
        .apple-btn img {
            width: 18px; /* تصغير الصورة */
            height: 18px;
            margin-left: 8px;
        }
 
   .image-section {
     width: 50%;
    height: 100vh; /* يغطي الشاشة بالكامل */
    background: url("img/alula.png") no-repeat center center;
    background-size: cover; /* يجعل الصورة تغطي الجزء بالكامل */
}

       
       
        .signup-text {
    display: flex;
    justify-content: center;
    gap: 5px;
}

        a {
            display: block;
            color: #007bff;
            text-decoration: none;
            margin-bottom: 10px;
            text-align: right;
        }

        .remember-me {
            display: flex;
            align-items: center;
            justify-content: right;
            gap: 5px;
            width: 100%;
            margin-bottom: 10px;
        }
        .remember-me input[type="checkbox"] {
    width: 16px;  /* تعديل العرض */
    height: 16px; /* تعديل الارتفاع */
    cursor: pointer; /* تحسين تجربة المستخدم */
}


        .or-text {
            margin: 15px 0;
            color: #352107;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .login-section, .image-section {
                width: 100%;
            }
            .image-section {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-section">
   
        </div>
        
        <div class="login-section">
            <h2>مرحبًا بعودتك !</h2>
            <p>أدخل بيانات الاعتماد الخاصة بك للوصول إلى حسابك</p>
            
            <form id="loginForm">
                <label for="email">عنوان البريد الإلكتروني</label>
                <input type="email" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required>

                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" placeholder="******" required>
                <a href="#">هل نسيت كلمة السر؟</a>

                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">تذكرني</label>
                </div>

                <a href="home.php"><button >تسجيل دخول</button></a>
            </form>

            <p class="or-text">أو</p>

            <button class="google-btn">
                <img src="img/google.png"
                     alt="Google">
                Sign in with Google
            </button>
            
            <button class="apple-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple">
                تسجيل الدخول مع آبل
            </button>
            <p class="signup-text">ليس لديك حساب؟ <a href="signup.html">إنشاء حساب</a></p>

        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();
             alert("🚀 تسجيل الدخول قيد التنفيذ...");
        });
    </script>

</body>
</html>
